services:
  - type: web
    name: ecoroute-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./ecoroute.db      # swap to a Render Postgres URL for persistence
      - key: SECRET_KEY
        generateValue: true                 # Render auto-generates a secure random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "24"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: ""                           # fill in your Vercel URL after first deploy
      - key: VISION_MODEL_PATH
        value: ""
      - key: CONTRACT_ADDRESS
        value: ""
      - key: MINTER_PRIVATE_KEY
        value: ""
    healthCheckPath: /health
